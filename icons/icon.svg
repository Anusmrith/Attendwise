<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Check Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Calendar / Attendance Sheet Body -->
  <g filter="url(#dropShadow)">
    <rect x="116" y="128" width="280" height="268" rx="36" fill="url(#cardGrad)" />
    
    <!-- Header banner of sheet -->
    <path d="M 116 164 Q 116 128 152 128 L 360 128 Q 396 128 396 164 L 396 196 L 116 196 Z" fill="#4338ca" />
    
    <!-- Spiral Rings / Binder Pegs -->
    <rect x="172" y="112" width="24" height="36" rx="12" fill="#e0e7ff" />
    <rect x="244" y="112" width="24" height="36" rx="12" fill="#e0e7ff" />
    <rect x="316" y="112" width="24" height="36" rx="12" fill="#e0e7ff" />

    <!-- Attendance Checklist Rows -->
    <!-- Row 1 -->
    <circle cx="168" cy="242" r="14" fill="#4f46e5" />
    <path d="M 163 242 L 167 246 L 174 238" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="198" y="235" width="150" height="14" rx="7" fill="#cbd5e1" />

    <!-- Row 2 -->
    <circle cx="168" cy="286" r="14" fill="#4f46e5" />
    <path d="M 163 286 L 167 290 L 174 282" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="198" y="279" width="115" height="14" rx="7" fill="#cbd5e1" />

    <!-- Row 3 -->
    <circle cx="168" cy="330" r="14" fill="#10b981" />
    <path d="M 163 330 L 167 334 L 174 326" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="198" y="323" width="135" height="14" rx="7" fill="#cbd5e1" />
  </g>

  <!-- Big Floating Verified Checkmark Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="372" cy="372" r="54" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="6" />
    <path d="M 352 372 L 366 386 L 396 354" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
